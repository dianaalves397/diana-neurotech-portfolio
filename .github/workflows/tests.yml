name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  neural-decoding:
    name: Neural decoding tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/neural-decoding-portfolio

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/neural-decoding-portfolio/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run test suite
        run: python -m pytest

  diabetes-explorer:
    name: Diabetes explorer tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/diabetes-data-explorer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/diabetes-data-explorer/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run test suite
        run: python -m pytest -q
