name: Import Diana Alves portfolio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-portfolio.yml'

permissions:
  contents: write

jobs:
  import-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract prepared portfolio
        shell: bash
        run: |
          set -euo pipefail
          test -f Diana-Alves-Codex.zip
          rm -rf .portfolio-import
          mkdir .portfolio-import
          unzip -q Diana-Alves-Codex.zip -d .portfolio-import
          rsync -a --exclude='.git/' --exclude='.github/workflows/import-portfolio.yml' .portfolio-import/ ./
          rm -rf .portfolio-import
          rm -f Diana-Alves-Codex.zip

      - name: Commit imported files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Import Diana Alves portfolio and projects'
          git push origin main
